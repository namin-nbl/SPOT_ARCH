<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="theme-color" content="#ffffff" />
    <meta name="description" content="ARCH SPOT mission monitoring and anomaly workflow" />
    <title>ARCH · SPOT Mission Monitor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        let savedTheme = null;
        try { savedTheme = localStorage.getItem("arch-spot-theme"); } catch {}
        const systemTheme = window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemTheme;
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <svg aria-hidden="true" class="svg-sprite">
      <symbol id="icon-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="icon-mission" viewBox="0 0 24 24"><path d="M5 19V7l7-4 7 4v12"/><path d="M3 19h18M8 10h8M8 14h5"/></symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 3 2.7 19h18.6L12 3Z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="icon-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-7 4 14 2-7h6"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="icon-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v5l-4 2v-7L4 5Z"/></symbol>
      <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.34-5.66L4 8.68"/><path d="M4 4v4.68h4.68"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 20h16"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M18.5 9A7 7 0 0 0 6 6.5L4 9m16 6-2 2.5A7 7 0 0 1 5.5 15"/></symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="icon-robot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="11" rx="3"/><path d="M12 3v4M8 21v-3m8 3v-3M8 12h.01M16 12h.01M9 15h6"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3Z"/><path d="M14 3v5h5M9 13h6m-6 4h6"/></symbol>
      <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 2-2 6 5"/></symbol>
      <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1"/></symbol>
      <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6H5V6h6"/></symbol>
      <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V5H5v11h3"/></symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    </svg>

    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand" aria-label="Niagara ARCH">
          <span class="brand-niagara">niagara</span>
          <span class="brand-divider"></span>
          <span class="brand-arch">ARCH<sup>+</sup></span>
        </div>

        <div class="product-mark">
          <span class="product-icon"><svg><use href="#icon-robot"></use></svg></span>
          <span><strong>SPOT</strong><small>Mission intelligence</small></span>
        </div>

        <nav class="primary-nav" aria-label="Primary navigation">
          <button class="nav-item active" data-route="overview">
            <svg><use href="#icon-overview"></use></svg><span>Overview</span>
          </button>
          <button class="nav-item" data-route="tickets">
            <svg><use href="#icon-file"></use></svg><span>Tickets</span><span class="nav-count" id="ticket-nav-count">—</span>
          </button>
        </nav>

        <div class="sidebar-status">
          <div class="status-row"><span class="status-dot"></span><span>All systems operational</span></div>
          <small>Orbit → Litmus → ARCH</small>
        </div>
        <div class="sidebar-footer">Asset Management · v1.0</div>
      </aside>

      <div class="mobile-scrim" id="mobile-scrim"></div>

      <section class="workspace">
        <header class="topbar">
          <div class="topbar-title-group">
            <button class="icon-button menu-button" id="menu-button" aria-label="Open navigation">
              <svg><use href="#icon-menu"></use></svg>
            </button>
            <div>
              <div class="eyebrow" id="page-eyebrow">SPOT Robotics</div>
              <h1 id="page-title">Mission overview</h1>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
              <svg><use id="theme-icon-use" href="#icon-moon"></use></svg>
            </button>
            <span class="environment-pill"><span class="status-dot"></span>Production</span>
            <button class="icon-button notification-button" aria-label="Notifications">
              <svg><use href="#icon-bell"></use></svg><span class="notification-dot"></span>
            </button>
            <button class="profile-button" aria-label="Open user menu">
              <span class="avatar">MO</span>
              <span class="profile-copy"><strong>Mariah Olvera</strong><small>Asset Reliability</small></span>
              <svg><use href="#icon-chevron"></use></svg>
            </button>
          </div>
        </header>

        <main id="main-content" tabindex="-1">
          <div class="loading-state" id="initial-loader">
            <span class="spinner"></span><span>Loading mission intelligence…</span>
          </div>
        </main>
      </section>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite"></div>

    <dialog class="drawer-dialog" id="alert-dialog">
      <div id="alert-dialog-content"></div>
    </dialog>

    <dialog class="preview-dialog" id="preview-dialog">
      <div class="preview-dialog-header">
        <div><span class="eyebrow">Orbit capture</span><h2 id="preview-title">Attachment preview</h2></div>
        <button class="icon-button" id="preview-close" aria-label="Close preview"><svg><use href="#icon-close"></use></svg></button>
      </div>
      <div class="preview-frame-wrap"><iframe id="preview-frame" title="Attachment preview"></iframe></div>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
